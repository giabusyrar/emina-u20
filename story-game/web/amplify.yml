# Amplify Hosting build spec for this app. Paste it into App settings > Build settings (monorepo: set
# AMPLIFY_MONOREPO_APP_ROOT=story-game/web). Paths are relative to story-game/web.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || (nvm install 22 && nvm use 22)
        - npm ci
    build:
      commands:
        - npm test
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
