# Lint, test and build. The Docker image is built on deploy (README).
stages: [test]

variables:
  GOWORK: "off"

test:
  stage: test
  image: golang:1.25
  before_script:
    # core-engine pins the face worker's anchors/frame/measures sources by hash
    # (internal/facearch/measureclient/anchors_test.go). Allow this project in
    # seagull-worker-face's Settings > CI/CD > Job token permissions.
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/seagull-worker-face.git" ../seagull-worker-face
  script:
    - test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: files above need formatting"; exit 1; }
    - go vet ./...
    - go test ./...
    - go build ./...
    - sh scripts/check-platform-mirror.sh
