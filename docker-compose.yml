# core-engine on its own. Postgres and Redis are not defined here; they come
# from Seagull-gateway's docker-compose.infra.yml, which also creates the
# external `seagull` network every Seagull repository's compose joins:
#
#   docker network create seagull     # once per host, if infra is not used
#   docker compose up -d --build
#
# Other services are reached by their service names on that network
# (core-engine:8082, worker-skin:8088, … — seagull-core-engine docs/PORTS.md).
# Start order across repositories is not expressed here; each worker's models
# are part of its image.

services:
  core-engine:
    build:
      context: .
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - CORE_ENGINE_PORT=8082
      - DATABASE_URL=${DATABASE_URL}
      - REFERENCE_SERVICE_URL=${REFERENCE_SERVICE_URL:-http://reference-service:8086}
      - SKIN_WORKER_URL=${SKIN_WORKER_URL:-http://worker-skin:8088}
      - FACE_WORKER_URL=${FACE_WORKER_URL:-http://worker-face:8094}
      - TRYON_ENGINE_URL=${TRYON_ENGINE_URL:-http://worker-tryon:8090}
      - COLOUR_WORKER_URL=${COLOUR_WORKER_URL:-http://worker-colour:8092}
    networks: [seagull]
    healthcheck:
      # /health answers 503 while Postgres is down (internal/platform/health.go).
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  seagull:
    name: seagull
    external: true
