<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Empat Pintu Satu Hari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap">
<style>
:root{--ink:#43283A;--pink:#FF4D97;--pink-deep:#E0357D;--cream:#FFF4F9;--sky:#CDBEF2;--floor:#FBD9B0;
  --e-out:cubic-bezier(.25,1,.5,1);--e-move:cubic-bezier(.65,0,.35,1);--e-door:cubic-bezier(.33,0,.1,1);--e-pop:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1226;font-family:Poppins,system-ui,sans-serif;
  color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
#world{position:fixed;inset:0;background:var(--floor);transition:background 1.4s var(--e-move)}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#scene{height:100%;width:auto;max-width:none;display:block;transform-origin:50% 50%;
  transition:transform 1.6s var(--e-move),opacity .5s}
@media (max-aspect-ratio:9/16){#scene{width:100%;height:auto}}
#bloom{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
#black{position:fixed;inset:0;background:#1b1226;opacity:1;pointer-events:none;transition:opacity .7s;z-index:45}
#black.off{opacity:0}
/* caption: lower third, on the wall, never a box */
#scrim{position:fixed;left:0;right:0;bottom:0;height:38vh;pointer-events:none;z-index:29;background:linear-gradient(to top,rgba(255,244,249,.78) 0%,rgba(255,244,249,.42) 45%,rgba(255,244,249,0) 100%);transition:opacity .5s}
#scrim.dark{background:linear-gradient(to top,rgba(27,18,38,.72) 0%,rgba(27,18,38,.38) 45%,rgba(27,18,38,0) 100%)}
#cap{position:fixed;left:0;right:0;bottom:calc(14vh + env(safe-area-inset-bottom,0px));padding:0 26px;z-index:30;pointer-events:none}
#narr{margin:0 auto;max-width:34ch;font-weight:300;font-size:clamp(16px,4.4vw,19px);line-height:1.38;letter-spacing:.015em;
  color:var(--ink);opacity:0;transform:translateY(8px);transition:opacity .26s var(--e-out),transform .26s var(--e-out);text-wrap:pretty}
#narr.on{opacity:.9;transform:none}
#narr.dark{color:#FFF4F9}
#sound{margin:10px auto 0;max-width:34ch;font-weight:400;font-size:clamp(13.5px,3.6vw,15.5px);line-height:1.5;color:#7a5565;
  opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
#sound.on{opacity:1;transform:none}
#sound.dark{color:#f3dbe6}
#ring{position:fixed;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;pointer-events:none;z-index:35;opacity:0;
  background:conic-gradient(var(--pink) calc(var(--p,0)*1turn),rgba(255,255,255,.35) 0);
  -webkit-mask:radial-gradient(circle,transparent 57%,#000 60%);mask:radial-gradient(circle,transparent 57%,#000 60%)}
#ring.on{opacity:1}
/* hotspots */
.hot{cursor:pointer}
.hot>*{transition:transform .14s var(--e-out)}
.hot.press{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.96)}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.55}}
.hot .cue{opacity:0;pointer-events:none}
.hot.cue-on .cue{animation:pulse 2.2s var(--e-move) infinite}
#scene.walking .hot:not(.target){opacity:.45;transition:opacity .4s}
#scene.listening .hot:not(.target){opacity:.4;transition:opacity .3s}
.hot.target .glow{opacity:1!important;transition:opacity .4s}
/* actor */
#actor{transition:transform 1.15s cubic-bezier(.3,0,.22,1),opacity .5s}
#actorBob{animation:idle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes idle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
.walking #actorBob{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.lg{transform-box:fill-box;transform-origin:50% 0}
.walking .lgL{animation:stepL .42s ease-in-out infinite alternate}
.walking .lgR{animation:stepR .42s ease-in-out infinite alternate}
@keyframes stepL{from{transform:translateY(0) rotate(0)}to{transform:translateY(-4px) rotate(-14deg)}}
@keyframes stepR{from{transform:translateY(-4px) rotate(14deg)}to{transform:translateY(0) rotate(0)}}
#pool{transition:opacity .9s}
/* dust motes */
.mote{animation:drift linear infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(14px,-46px)}}
/* lamp drag */
#dragLamp{position:fixed;width:46px;height:60px;margin:-30px 0 0 -23px;pointer-events:none;z-index:38;opacity:0;
  filter:drop-shadow(0 6px 10px rgba(67,40,58,.35));transition:opacity .3s}
#dragLamp.on{opacity:1}
/* reveal */
#reveal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:#1b1226;color:#FFF4F9;text-align:center;padding:24px}
#reveal.on{display:flex}
#flame{width:18px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#FFE08A;
  box-shadow:0 0 24px 8px rgba(255,224,138,.55);transform:scale(0);transition:transform .9s var(--e-out),box-shadow .9s}
#flame.on{transform:scale(1)}
#flood{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--c2) 0,var(--c1) 48%,#1b1226 100%);
  opacity:0;transform:scale(.2);transition:opacity .52s,transform .52s var(--e-move)}
#flood.on{opacity:1;transform:scale(1)}
#rvType{position:relative;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(34px,10.5vw,52px);line-height:1.02;
  margin:0;letter-spacing:-.01em;min-height:1.1em}
#rvType span{opacity:0;display:inline-block;transform:translateY(10px);transition:opacity .22s,transform .22s var(--e-out)}
#rvType span.on{opacity:1;transform:none}
#rvEn{position:relative;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  opacity:0;margin:8px 0 0;transition:opacity .4s .1s}
#rvEn.on{opacity:.75}
#rvLine{position:relative;font-weight:300;font-size:clamp(15px,4.2vw,18px);line-height:1.5;max-width:30ch;margin:22px 0 0;
  opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s var(--e-out)}
#rvLine.on{opacity:.92;transform:none}
#rvGo{position:relative;margin-top:34px;border:none;cursor:pointer;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;
  padding:14px 26px;border-radius:999px;background:#FFF4F9;color:var(--pink-deep);opacity:0;transition:opacity .5s .3s}
#rvGo.on{opacity:1}
/* result + share */
#result{position:fixed;inset:0;z-index:55;display:none;overflow:auto;background:var(--cream);color:var(--ink);
  padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px))}
#result.on{display:block}
.hero{border-radius:28px;padding:18px 20px 22px;text-align:center;box-shadow:0 18px 40px rgba(67,40,58,.14)}
.hero .m{width:170px;margin:0 auto}
.hero h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(28px,8vw,36px);margin:4px 0 0;line-height:1.02}
.hero .en{font-family:'Baloo 2',sans-serif;font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-top:4px}
.closing{margin:16px 0 0;font-weight:300;font-size:15px;line-height:1.6}
.closing b{display:block;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--pink-deep);margin-bottom:6px}
.trail{display:flex;gap:6px;margin:18px 0 0;justify-content:center;flex-wrap:wrap}
.trail svg{width:54px;height:96px;border-radius:12px;background:#fff}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.btn{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;border:none;border-radius:999px;padding:15px 20px;min-height:52px;
  cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pink),#FF77B0);box-shadow:0 14px 30px rgba(224,53,125,.22)}
.btn.ghost{background:#fff;color:var(--pink-deep);border:2px solid #FFD7E9;box-shadow:none}
.row{display:flex;gap:10px}.row .btn{flex:1}
.fine{text-align:center;font-size:11.5px;color:#8A6678;margin:12px 0 0}
#modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(27,18,38,.6);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#modal .in{background:var(--cream);border-radius:24px;padding:16px;max-width:380px;width:100%;max-height:94vh;overflow:auto;position:relative}
#cardImg{width:100%;border-radius:14px;display:block;aspect-ratio:9/16;background:#FFE9F3}
.mx{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:none;background:#fff;cursor:pointer;color:var(--pink-deep);font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>

<div id="world">
  <div id="stage"><svg id="scene" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="scrim"></div><div id="cap"><p id="narr"></p><p id="sound"></p></div>
  <div id="ring"></div>
  <svg id="dragLamp" viewBox="0 0 46 60"><path d="M23 4 L23 14" stroke="#9B9BB5" stroke-width="3" stroke-linecap="round"/><path d="M8 14 H38 L32 40 H14 Z" fill="#FFE08A"/><rect x="12" y="40" width="22" height="8" rx="4" fill="#9B9BB5"/><ellipse cx="23" cy="56" rx="16" ry="4" fill="#FFE08A" opacity=".45"/></svg>
</div>
<div id="bloom"></div>
<div id="black"></div>

<div id="reveal">
  <div id="flood"></div>
  <div id="flame"></div>
  <h2 id="rvType"></h2>
  <div id="rvEn"></div>
  <p id="rvLine"></p>
  <button id="rvGo" type="button">Lihat kartuku &#10024;</button>
</div>

<div id="result">
  <div class="hero" id="hero"><div class="m" id="rM"></div><h1 id="rNick"></h1><div class="en" id="rEn"></div></div>
  <p class="closing"><b>Besok paginya</b><span id="rClose"></span></p>
  <div class="trail" id="rTrail"></div>
  <div class="btns">
    <button class="btn" id="share" type="button">Bikin Story Card &#128242;</button>
    <div class="row"><button class="btn ghost" id="again" type="button">Jalan balik &#8617;</button>
      <button class="btn ghost" id="reg" type="button">Daftar 20U20 &#10022;</button></div>
  </div>
  <p class="fine" id="fine"></p>
</div>

<div id="modal"><div class="in"><button class="mx" id="mx" type="button" aria-label="Tutup">&#10005;</button>
  <img id="cardImg" alt="Story card">
  <div class="btns" style="margin-top:12px"><button class="btn" id="saveCard" type="button">Simpan / Share &#128190;</button></div>
  <p class="fine">Tekan &amp; tahan gambarnya buat simpan</p></div></div>

<canvas id="cardCanvas" width="1080" height="1920" class="sr" aria-hidden="true"></canvas>

<script>
/*__MASCOTS__*/
/*__ARCH__*/
const STORY=/*__STORY__*/;
const ART=/*__ART__*/;
const SKY=/*__SKY__*/;
const FLOOR=/*__FLOOR__*/;

const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const SC={};STORY.scenes.forEach(s=>SC[s.id]=s);
const END={};STORY.endings.forEach(e=>END[e.character]=e);
const KEYS=['creator','boss','artisan','deep','change','explorer'];
const scene=$('#scene'),world=$('#world'),narr=$('#narr'),snd=$('#sound');

/* ---------------- state ---------------- */
let G;
function fresh(){G={node:'a1_pintu',score:{},trail:[],heard:{},listenMs:{},hasLamp:false,busy:false,entryX:150};}

/* ---------------- sound (synth only) ---------------- */
const SFX={ctx:null,amb:null,ambGain:null,
  unlock(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.ambient();}catch(e){}},
  ambient(){const c=this.ctx;if(!c)return;const g=c.createGain();g.gain.value=0;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
    [110,110.6].forEach(f=>{const o=c.createOscillator();o.frequency.value=f;o.connect(lp);o.start();});
    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.08;lg.gain.value=.008;lfo.connect(lg);lg.connect(g.gain);lfo.start();
    lp.connect(g);g.connect(c.destination);g.gain.setTargetAtTime(.02,c.currentTime,1.2);this.ambGain=g;},
  duck(on){if(!this.ambGain)return;this.ambGain.gain.setTargetAtTime(on?.008:.02,this.ctx.currentTime,.25);},
  noise(dur){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s;},
  step(side){const c=this.ctx;if(!c)return;const s=this.noise(.04),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=1.2;
    const g=c.createGain();g.gain.value=.06;const p=c.createStereoPanner?c.createStereoPanner():null;if(p)p.pan.value=side?.15:-.15;
    s.connect(bp);bp.connect(g);if(p){g.connect(p);p.connect(c.destination);}else g.connect(c.destination);s.start();},
  door(){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(90,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(60,c.currentTime+.38);g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.42);const n=this.noise(.08),ng=c.createGain();ng.gain.value=.04;n.connect(ng);ng.connect(c.destination);n.start();},
  lamp(){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(660,c.currentTime);
    o.frequency.linearRampToValueAtTime(990,c.currentTime+.18);g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(.08,c.currentTime+.18);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.6);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+1.7);},
  chord(){const c=this.ctx;if(!c)return;const dl=c.createDelay();dl.delayTime.value=.12;const fb=c.createGain();fb.gain.value=.35;dl.connect(fb);fb.connect(dl);dl.connect(c.destination);
    [523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;const t=c.currentTime+i*.16;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.1);g.gain.exponentialRampToValueAtTime(.001,t+2.4);o.connect(g);g.connect(c.destination);g.connect(dl);o.start(t);o.stop(t+2.5);});}
};
const haptic=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

/* ---------------- actor ---------------- */
function actorMarkup(){
  return '<g id="actor"><g id="actorBob">'
   +'<ellipse cx="0" cy="1" rx="15" ry="4.5" fill="#43283A" opacity=".16"/>'
   +'<g class="legs"><rect class="lg lgL" x="-7.5" y="-17" width="5.5" height="17" rx="2.7" fill="#9E8FD6"/>'
   +'<rect class="lg lgR" x="2" y="-17" width="5.5" height="17" rx="2.7" fill="#9E8FD6"/></g>'
   +'<rect x="-13.5" y="-53" width="27" height="38" rx="13" fill="#FF8FC0"/>'
   +'<rect x="-9.5" y="-70" width="19" height="24" rx="9.5" fill="#8A4FD6"/>'
   +'<circle cx="0" cy="-66" r="11.5" fill="#8A4FD6"/>'
   +'<line x1="6" y1="-50" x2="15" y2="-38" stroke="#E0357D" stroke-width="3" stroke-linecap="round"/>'
   +'<rect x="11" y="-40" width="12" height="14" rx="6" fill="#FF4D97"/>'
   +'<g id="lampHand" style="opacity:0;transition:opacity .4s">'
   +'<circle id="pool" cx="-24" cy="-6" r="70" fill="url(#poolG)" opacity="0"/>'
   +'<path d="M-20 -46 L-20 -38" stroke="#9B9BB5" stroke-width="2.4" stroke-linecap="round"/>'
   +'<path d="M-28 -38 H-12 L-15 -24 H-25 Z" fill="#FFE08A"/><rect x="-26" y="-24" width="12" height="4" rx="2" fill="#9B9BB5"/></g>'
   +'</g></g>';
}
const DEFS='<defs><radialGradient id="poolG"><stop offset="0" stop-color="#FFE08A" stop-opacity=".55"/><stop offset=".6" stop-color="#FFE08A" stop-opacity=".18"/><stop offset="1" stop-color="#FFE08A" stop-opacity="0"/></radialGradient></defs>';
function placeActor(x,y,instant){const a=$('#actor');if(!a)return;if(instant){a.style.transition='none';}a.style.transform='translate('+x+'px,'+y+'px)';
  a.dataset.x=x;a.dataset.y=y;if(instant){void a.offsetWidth;a.style.transition='';}}
async function walkTo(x,y){
  const a=$('#actor');if(!a)return;const fx=+a.dataset.x||0;const dist=Math.abs(x-fx);
  const dur=Math.max(420,Math.min(1400,dist*5.6));
  a.style.transitionDuration=dur+'ms';scene.classList.add('walking');
  const steps=Math.max(2,Math.round(dur/210));let i=0;const iv=setInterval(()=>{SFX.step(i++%2);},210);
  placeActor(x,y);await wait(dur);clearInterval(iv);scene.classList.remove('walking');a.style.transitionDuration='';
}
function giveLamp(){G.hasLamp=true;const h=$('#lampHand'),p=$('#pool');if(!h)return;
  h.style.transition='opacity .32s var(--e-pop),transform .32s var(--e-pop)';h.style.transformBox='fill-box';h.style.transformOrigin='50% 100%';
  h.style.transform='scale(1.25)';h.style.opacity='1';setTimeout(()=>{h.style.transform='';},320);if(p)p.style.opacity='1';SFX.lamp();haptic([8,40,8]);}

/* ---------------- caption ---------------- */
let capTok=0;
function sentences(t){return (t||'').match(/[^.!?…]+[.!?…]*/g)?.map(s=>s.trim()).filter(Boolean)||[];}
async function caption(text,opts){
  const tok=++capTok;const dark=!!(opts&&opts.dark);narr.classList.toggle('dark',dark);snd.classList.toggle('dark',dark);$('#scrim').classList.toggle('dark',dark);
  const parts=sentences(text);
  for(const p of parts){if(tok!==capTok)return;
    narr.classList.remove('on');await wait(180);if(tok!==capTok)return;
    narr.textContent=p;narr.classList.add('on');
    await wait(Math.min(3600,900+p.length*46));}
}
function clearCaption(){capTok++;narr.classList.remove('on');snd.classList.remove('on');}

/* ---------------- scene ---------------- */
function loadScene(id,fromLeft){
  G.node=id;const s=SC[id];
  world.style.background=FLOOR[id]||'#FBD9B0';
  scene.innerHTML=DEFS+(ART[id]||'')+actorMarkup();
  if(G.hasLamp){const h=$('#lampHand');h.style.opacity='1';$('#pool').style.opacity='1';}
  const hots=[...scene.querySelectorAll('.hot')];
  const floorY=hots.length?(+((hots[0].dataset.stand||'180,520').split(',')[1])||520):520;
  // she enters from frame-left and walks to an offset mark (not centered)
  const mark=id==='a1_pintu'?150:(fromLeft?138:180);
  placeActor(fromLeft?-40:mark,floorY,true);
  // wire hotspots: add glow + cue layers behind each object
  hots.forEach((g,i)=>{
    const bb=g.getBBox();const glow=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    glow.setAttribute('class','glow');glow.setAttribute('cx',bb.x+bb.width/2);glow.setAttribute('cy',bb.y+bb.height*.55);
    glow.setAttribute('rx',bb.width*.62);glow.setAttribute('ry',bb.height*.5);glow.setAttribute('fill','#FFFFFF');glow.setAttribute('opacity','0');
    const cue=glow.cloneNode();cue.setAttribute('class','cue');cue.setAttribute('opacity','0');
    g.insertBefore(cue,g.firstChild);g.insertBefore(glow,g.firstChild);
    wireHot(g,i,s.options[i]);
  });
  return {hots,floorY,mark};
}
function wireHot(g,i,opt){
  let t=null,held=false,ringTok=0,t0=0;
  const hasSound=!!(opt.sound&&opt.sound.trim());
  g.addEventListener('pointerdown',e=>{
    if(G.busy)return;e.preventDefault();SFX.unlock();held=false;
    g.classList.add('press');haptic(12);
    if(hasSound){const ring=$('#ring');ring.style.left=e.clientX+'px';ring.style.top=e.clientY+'px';ring.style.setProperty('--p',0);ring.classList.add('on');
      t0=performance.now();const tok=++ringTok;
      const tick=()=>{if(tok!==ringTok)return;const p=Math.min(1,(performance.now()-t0)/900);ring.style.setProperty('--p',p);if(p<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);
      t=setTimeout(()=>{held=true;listen(g,i,opt);},900);}
  });
  const up=e=>{
    if(G.busy&&!held)return;clearTimeout(t);ringTok++;$('#ring').classList.remove('on');g.classList.remove('press');
    if(held){stopListen(g,i);held=false;return;}
    choose(g,i,opt);
  };
  g.addEventListener('pointerup',up);
  g.addEventListener('pointercancel',()=>{clearTimeout(t);ringTok++;$('#ring').classList.remove('on');g.classList.remove('press');if(held){stopListen(g,i);held=false;}});
}
function listen(g,i,opt){
  scene.classList.add('listening');g.classList.add('target');SFX.duck(true);
  G.heard[i]=true;G._lt=performance.now();
  snd.textContent=opt.sound;snd.classList.add('on');clearCue();
}
function stopListen(g,i){
  scene.classList.remove('listening');g.classList.remove('target');SFX.duck(false);
  if(G._lt){G.listenMs[i]=(G.listenMs[i]||0)+(performance.now()-G._lt);G._lt=0;}
  snd.classList.remove('on');
}
function clearCue(){scene.querySelectorAll('.hot').forEach(h=>h.classList.remove('cue-on'));}
function cueOne(){const hs=scene.querySelectorAll('.hot');if(!hs.length)return;const pick=hs[G.node==='a1_pintu'?0:Math.floor(hs.length/2)];pick.classList.add('cue-on');}

/* ---------------- the choice as a performance ---------------- */
async function choose(g,i,opt){
  if(G.busy)return;G.busy=true;clearCue();clearCaption();
  const sc=SC[G.node];
  const st=(g.dataset.stand||'180,520').split(',').map(Number);
  // 0-120 tap ack already (press). 120-280 world reacts
  await wait(120);scene.classList.add('walking');g.classList.add('target');
  // 280-1400 she walks there
  await walkTo(st[0],st[1]);
  // she acts on it: the object lifts once
  const kids=[...g.children].filter(k=>!k.classList.contains('glow')&&!k.classList.contains('cue'));
  kids.forEach(k=>{k.style.transformBox='fill-box';k.style.transformOrigin='50% 100%';k.style.transition='transform .32s var(--e-pop)';k.style.transform='translateY(-6px) scale(1.04)';});
  await wait(340);kids.forEach(k=>{k.style.transform='';});
  // score
  const sco={};(opt.scores||'').split(/[,\s]+/).forEach(p=>{const m=/^([a-z]+)\+(\d+)$/.exec(p);if(m)sco[m[1]]=(sco[m[1]]||0)+ +m[2];});
  for(const k in sco)G.score[k]=(G.score[k]||0)+sco[k];
  G.trail.push({node:G.node,i});
  // the lamp enters her hand in the yard
  if(G.node==='a4_halaman'&&!G.hasLamp){await wait(200);giveLamp();await wait(500);}
  // 1400 caption rises (the transition line); the camera follows while it is still readable
  caption(opt.transition);
  await wait(1300);
  g.classList.remove('target');scene.classList.remove('walking');
  if(opt.leadsTo==='ending'){await reveal();return;}
  await transitionTo(opt.leadsTo,g);
  G.busy=false;
}
async function transitionTo(id,g){
  // camera pushes through what she chose
  const bb=g.getBBox();const r=scene.getBoundingClientRect();const vb=scene.viewBox.baseVal;
  const ox=((bb.x+bb.width/2)/vb.width*100),oy=((bb.y+bb.height/2)/vb.height*100);
  scene.style.transformOrigin=ox+'% '+oy+'%';scene.style.transform='scale(2.6)';
  SFX.door();
  await wait(560);$('#bloom').style.opacity='1';clearCaption();
  await wait(260);
  scene.style.transition='none';scene.style.transform='scale(1.06)';scene.style.opacity='0';
  const info=loadScene(id,true);
  void scene.offsetWidth;scene.style.transition='';scene.style.transform='';scene.style.opacity='1';
  $('#bloom').style.opacity='0';
  await wait(260);
  // she walks in from the left to her mark, then the room speaks
  await walkTo(info.mark,info.floorY);
  await wait(800); // authored silence
  caption(SC[id].narration);
  await wait(900);cueOne();
}

/* ---------------- reveal ceremony ---------------- */
function winner(){let mx=-1;KEYS.forEach(k=>{if((G.score[k]||0)>mx)mx=G.score[k]||0;});let top=KEYS.filter(k=>(G.score[k]||0)===mx);
  if(top.length===1)return top[0];
  for(let t=G.trail.length-1;t>=0;t--){const o=SC[G.trail[t].node].options[G.trail[t].i];const sc={};(o.scores||'').split(/[,\s]+/).forEach(p=>{const m=/^([a-z]+)\+(\d+)$/.exec(p);if(m)sc[m[1]]=+m[2];});
    let best=0;top.forEach(k=>{if((sc[k]||0)>best)best=sc[k]||0;});if(best>0){const c=top.filter(k=>(sc[k]||0)===best);if(c.length===1)return c[0];top=c;}}
  return top[0];}
let currentKey=null;
async function reveal(){
  const k=winner();currentKey=k;const a=ARCH[k],e=END[k]||{closing:''};
  clearCaption();
  $('#black').classList.remove('off');await wait(1200);           // black + silence
  const rv=$('#reveal');rv.style.setProperty('--c1',a.c1);rv.style.setProperty('--c2',a.c2);rv.classList.add('on');$('#black').classList.add('off');
  $('#flame').classList.add('on');SFX.lamp();await wait(900);       // the lamp alone
  $('#flood').classList.add('on');SFX.chord();await wait(520);      // light floods out
  const T=$('#rvType');T.innerHTML='';[...a.nick].forEach(ch=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;T.appendChild(s);});
  const spans=T.querySelectorAll('span');for(let i=0;i<spans.length;i++){spans[i].classList.add('on');await wait(28);}
  $('#rvEn').textContent=a.en;$('#rvEn').classList.add('on');
  await wait(300);$('#rvLine').textContent=a.tag||'';$('#rvLine').classList.add('on');
  await wait(800);$('#rvGo').classList.add('on');
}
$('#rvGo').addEventListener('click',()=>{$('#reveal').classList.remove('on');showResult();});

/* ---------------- result ---------------- */
function showResult(){
  const k=currentKey,a=ARCH[k],e=END[k]||{closing:''};
  $('#rM').innerHTML=mascotSVG(k);$('#rNick').textContent=a.nick;$('#rEn').textContent=a.en;$('#rClose').textContent=e.closing;
  $('#hero').style.background='linear-gradient(160deg,#fff 0%,'+a.soft+' 42%,'+a.c2+' 100%)';
  const tm=$('#rTrail');tm.innerHTML=G.trail.map(t=>{const s=SC[t.node];return '<svg viewBox="0 0 360 640">'+(ART[t.node]||'')+'</svg>';}).join('');
  const notOpened=[0,1,2,3].filter(i=>i!==G.trail[0].i);const longest=Object.keys(G.listenMs).sort((x,y)=>G.listenMs[y]-G.listenMs[x])[0];
  const door=SC.a1_pintu.options;
  $('#fine').textContent='1 dari 6 · pintu yang belum kamu buka: '+notOpened.map(i=>door[i].label.replace('Pintu yang ','')).join(', ')
    +(longest!==undefined?' · yang paling lama kamu dengerin: '+door[longest].label.replace('Pintu yang ',''):'');
  $('#result').classList.add('on');buildCard(k);
}
$('#again').addEventListener('click',()=>{const heard=G.heard;fresh();G.heard=heard;$('#result').classList.remove('on');$('#reveal').classList.remove('on');
  ['flame','flood','rvEn','rvLine','rvGo'].forEach(id=>$('#'+id).classList.remove('on'));start(true);});
$('#reg').addEventListener('click',()=>window.open('https://bit.ly/Emina20Under20','_blank','noopener'));

/* ---------------- share card ---------------- */
const canvas=$('#cardCanvas'),cx=canvas.getContext('2d');
function rr(c,x,y,w,h,r){if(c.roundRect){c.beginPath();c.roundRect(x,y,w,h,r);return;}c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function svgImg(inner,vb,w,h){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);
  i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="'+vb+'">'+inner+'</svg>');});}
function wrapT(t,x,y,mw,lh){const w=t.split(' ');let l='',yy=y;w.forEach(q=>{const s=l+q+' ';if(cx.measureText(s).width>mw&&l){cx.fillText(l.trim(),x,yy);l=q+' ';yy+=lh;}else l=s;});cx.fillText(l.trim(),x,yy);return yy;}
async function buildCard(k){
  const a=ARCH[k],e=END[k]||{closing:''};
  let m=null;try{await document.fonts.ready;m=await svgImg(mascotSVG(k).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,''),'0 0 220 236',220,236);}catch(err){}
  const W=1080,H=1920;const g=cx.createLinearGradient(0,0,W*.3,H);g.addColorStop(0,a.c1);g.addColorStop(1,a.c2);cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.save();cx.globalAlpha=.18;cx.fillStyle='#fff';cx.beginPath();cx.arc(150,300,300,0,7);cx.fill();cx.beginPath();cx.arc(960,1700,340,0,7);cx.fill();cx.restore();
  cx.textAlign='center';cx.fillStyle='rgba(255,255,255,.92)';cx.font='600 30px Poppins,sans-serif';cx.fillText('EMPAT PINTU, SATU HARI',W/2,170);
  cx.font='700 26px "Baloo 2",sans-serif';cx.fillStyle='rgba(255,255,255,.75)';cx.fillText('emina · 20 under 20',W/2,215);
  if(m){cx.drawImage(m,W/2-190,330,380,408);}
  cx.fillStyle='rgba(255,255,255,.92)';cx.font='400 38px Poppins,sans-serif';cx.fillText('aku jadi',W/2,840);
  let ns=132;cx.font='800 '+ns+'px "Baloo 2",sans-serif';while(cx.measureText(a.nick).width>W-120&&ns>70){ns-=6;cx.font='800 '+ns+'px "Baloo 2",sans-serif';}
  cx.fillStyle='#fff';cx.fillText(a.nick,W/2,845+ns);
  cx.font='600 30px Poppins,sans-serif';cx.fillStyle='rgba(255,255,255,.9)';cx.fillText(a.en.toUpperCase(),W/2,845+ns+52);
  cx.font='300 38px Poppins,sans-serif';cx.fillStyle='#fff';const yEnd=wrapT(a.tag||e.closing,W/2,845+ns+140,W-220,52);
  const notOpened=[0,1,2,3].filter(i=>i!==G.trail[0].i).map(i=>SC.a1_pintu.options[i].label.replace('Pintu yang ','')).join(' · ');
  cx.font='400 28px Poppins,sans-serif';cx.fillStyle='rgba(255,255,255,.82)';cx.fillText('pintu yang belum kubuka: '+notOpened,W/2,Math.max(yEnd+90,1480));
  cx.fillStyle='rgba(255,255,255,.95)';rr(cx,90,1560,W-180,160,36);cx.fill();
  cx.fillStyle=a.c1;cx.font='800 40px "Baloo 2",sans-serif';cx.fillText('Kamu buka pintu yang mana? ✨',W/2,1620);
  cx.fillStyle='#6a4a5a';cx.font='500 28px Poppins,sans-serif';cx.fillText('1 dari 6  ·  @eminacosmetics  ·  #Emina20Under20',W/2,1672);
  try{$('#cardImg').src=canvas.toDataURL('image/png');}catch(err){}
}
let _dl;async function getDL(){if(_dl!==undefined)return _dl;try{_dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;}catch(e){_dl=null;}return _dl;}
$('#share').addEventListener('click',()=>$('#modal').classList.add('on'));
$('#mx').addEventListener('click',()=>$('#modal').classList.remove('on'));
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.remove('on');});
$('#saveCard').addEventListener('click',()=>{const a=ARCH[currentKey],name='emina-'+currentKey+'.png';
  canvas.toBlob(async b=>{if(!b)return;try{const f=new File([b],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Emina 20 Under 20',text:'Aku jadi '+a.nick+'. Kamu buka pintu yang mana? #Emina20Under20'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    const dl=await getDL();if(dl){try{await dl.save({filename:name,data:b});return;}catch(e){if(e&&e.code==='declined')return;}}
    try{const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}catch(e){}},'image/png');});

/* ---------------- cold open ---------------- */
function motes(){const vb=scene.viewBox.baseVal;let s='';for(let i=0;i<9;i++){const x=20+Math.random()*320,y=120+Math.random()*330,d=(7+Math.random()*6).toFixed(1),dl=(-Math.random()*8).toFixed(1);
  s+='<circle class="mote" cx="'+x+'" cy="'+y+'" r="1.6" fill="#FFF4F9" opacity=".55" style="animation-duration:'+d+'s;animation-delay:'+dl+'s"/>';}
  scene.insertAdjacentHTML('beforeend',s);}
async function start(isReplay){
  G.busy=true;clearCaption();
  const info=loadScene('a1_pintu',true);motes();
  // replayed doors she has heard already glow faintly
  if(isReplay){[...scene.querySelectorAll('.hot')].forEach((h,i)=>{if(G.heard[i]){h.querySelector('.glow').setAttribute('opacity','.5');}});}
  $('#black').classList.add('off');await wait(isReplay?400:1400);
  await walkTo(info.mark,info.floorY);     // she walks in on her own
  G.busy=false;                             // she is standing: the doors are live from here
  await wait(700);if(G.busy)return;cueOne(); // one door breathes: that is the tutorial
  await wait(900);if(G.busy)return;
  caption(SC.a1_pintu.narration);
}
fresh();start(false);
