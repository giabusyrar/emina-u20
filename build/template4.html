<style>
:root{
  --serif:Fraunces,Georgia,'Times New Roman',serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --ink:#2B1E2A;--ink2:#4A4A4A;--grey:#D9D9D9;--mag:#D91883;--mag2:#B5126C;--btn1:#FE41AA;--btn2:#FC3EA7;--pink:#F1BCD5;--pinkSoft:#FBE7F0;--yellow:#FFF7B2;--blue:#C8E3EC;
  --panel:#FFFFFF;--line:#F1BCD5;--e-out:cubic-bezier(.25,1,.5,1);--e-move:cubic-bezier(.65,0,.35,1);--e-pop:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1226;font-family:var(--sans);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,input{font-family:inherit}
#app{position:fixed;inset:0;margin:0 auto;max-width:460px;background:#fff;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.lang{border:1.5px solid var(--pink);background:#fff;color:var(--mag);font:800 11px/1 var(--sans);letter-spacing:.14em;padding:7px 10px;border-radius:999px;cursor:pointer}
/* ---------- welcome / cover ---------- */
#welcome{background:#5A4953;color:var(--ink);overflow:hidden}
#welcome .lang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:3;background:rgba(255,255,255,.88)}
/* the cover plate is the real brand artwork with its copy painted out; the live
   copy below sits at the same proportional positions as the source mockup. */
#khBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
.w-top{position:absolute;z-index:2;top:36.2%;left:0;right:0;padding:0 30px;text-align:center}
.w-bot{position:absolute;z-index:2;top:64.5%;left:0;right:0;padding:0;text-align:center}
.w-greet{font-family:var(--sans);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1.02;margin:0;letter-spacing:-.02em;color:#000}
.w-fearless{font-family:var(--sans);font-weight:600;font-size:clamp(15px,4.2vw,18px);line-height:1.44;margin:10px auto 0;max-width:30ch;color:#000}
.w-fearless b{font-weight:800}
/* input and button track the source mockup's proportions (55.5% / 52.7% of width) */
.w-namelbl{display:block;font:800 12.5px/1.25 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--mag);margin:0 0 12px;padding:0 20px}
.w-name{display:block;width:56%;max-width:262px;margin:0 auto}
.w-name input{width:100%;text-align:center;border:2px solid var(--mag);border-radius:9px;padding:16px 10px;font:600 16px var(--sans);color:var(--ink);background:#fff;outline:none;box-shadow:0 10px 22px rgba(120,60,90,.2)}
.w-name input::placeholder{color:#000;opacity:1;font-weight:500}
.w-name input:focus{box-shadow:0 0 0 3px rgba(218,24,132,.18)}
#startBtn{margin:40px auto 0;width:53%;max-width:248px;border:none;border-radius:999px;padding:14px 12px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;font:800 15px var(--sans);letter-spacing:.02em;text-transform:uppercase;cursor:pointer;box-shadow:0 14px 30px rgba(218,24,132,.34);transition:transform .15s var(--e-pop)}
#startBtn:active{transform:scale(.98)}
/* ---------- game ---------- */
/* --pbg / --pbg2 are set per scene from the artwork's own background colour
   (story JSON `panel`), so the scene melts into the copy panel with no seam. */
#game{background:var(--pbg,#FFF3F8);--pbg:#FFF3F8;--ncol:#000;--qcol:#000}
#game.lighttheme{--ncol:#000;--qcol:#000}
#game.darktheme{--ncol:#FFFFFF;--qcol:#FFFFFF}
#stage{position:relative;flex:0 0 52%;overflow:hidden;background:var(--fb,#F7CFE0);transition:background .5s,flex-basis .45s var(--e-move)}
#game.choosing #stage{flex-basis:36%}
@media (max-height:680px){#stage{flex-basis:46%}#game.choosing #stage{flex-basis:34%}}
#stage.plain{background:radial-gradient(125% 95% at 50% 18%,#FFF2F8 0%,#FCDCEB 48%,#F3BDD7 100%)}
#plainMark{position:absolute;left:50%;top:46%;width:24%;max-width:104px;transform:translate(-50%,-50%);opacity:0;transition:opacity .5s;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(218,24,132,.12))}
#stage.plain #plainMark{opacity:.42}
#stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease-in-out}
#stage img.bg.on{opacity:1}
#stage.plain img.bg{opacity:0!important}
#chip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;padding:6px 11px;border-radius:999px;background:rgba(43,30,42,.5);color:#fff;font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:translateY(-4px);transition:opacity .5s,transform .5s var(--e-out)}
#chip.on{opacity:1;transform:none}
#chip b{font-weight:800;color:var(--pink);margin-right:6px}
#stage::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:58px;background:linear-gradient(to top,var(--pbg,#FFF5FA),rgba(255,255,255,0));pointer-events:none;transition:background .5s}
#panel{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));position:relative;background:var(--pimg,none) bottom center/100% auto no-repeat,linear-gradient(180deg,var(--pbg,#FFF5FA),var(--pbg2,var(--pbg,#FFF5FA)));transition:background .5s}
#box{flex:0 0 auto;position:relative}
#txt{margin:0;font-family:var(--sans);font-size:clamp(15px,4.2vw,17.5px);line-height:1.42;font-weight:600;color:var(--ncol,#2B1E2A);min-height:2.2em;text-wrap:pretty}
#txt .q{color:var(--mag);font-weight:800}
#game.darktheme #txt .q{color:#FFC7E6}
#choices{margin-top:10px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(10px);transition:opacity .34s,transform .34s var(--e-out);pointer-events:none}
#choices.on{opacity:1;transform:none;pointer-events:auto}
#ask{font:800 13px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--qcol,#1F1622);margin:0 0 4px}
#ask:empty{display:none}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--mag);background:#fff;border-radius:14px;padding:10px 14px 10px 40px;font:600 13.5px/1.26 var(--sans);color:#000;position:relative;cursor:pointer;transition:transform .15s var(--e-out),background .2s,opacity .3s,border-color .2s;opacity:0;transform:translateX(8px);box-shadow:0 4px 14px rgba(43,30,42,.08)}
.opt.in{opacity:1;transform:none}
.opt::before{content:'\276F';position:absolute;left:17px;top:50%;transform:translateY(-50%);font:900 15px/1 var(--sans);color:var(--mag)}
.opt:active{transform:scale(.985);background:var(--pinkSoft)}
.opt.pick{background:var(--mag);color:#fff;border-color:var(--mag)}
.opt.pick::before{color:#fff}
.opt.dim{opacity:.32}
.opt.single{width:fit-content;max-width:100%;margin:0 auto;text-align:center;padding:16px 34px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;border-color:var(--mag);font-weight:800;box-shadow:0 14px 28px rgba(218,24,132,.32)}
.opt.single::before{content:''}
/* ---------- reveal ---------- */
#reveal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:flex-start;flex-direction:column;background:#FFE8F3;color:#000;text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 28px calc(28px + env(safe-area-inset-bottom,0px));overflow:auto}
#reveal.on{display:flex}
.rv-blobs{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.rv-blobs::before,.rv-blobs::after{content:'';position:absolute;border-radius:48% 52% 56% 44%/50%}
.rv-blobs::before{width:300px;height:300px;top:-70px;right:-80px;background:rgba(255,255,255,.5)}
.rv-blobs::after{width:360px;height:360px;bottom:-110px;left:-120px;background:rgba(255,196,224,.42)}
#reveal>*:not(.rv-blobs){position:relative;z-index:1}
#rvKick{font:800 15px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#000;margin:8px 0 0;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s var(--e-out)}
#rvIcon{width:min(60%,246px);aspect-ratio:1;margin:12px auto 0;opacity:0;transform:scale(.62) rotate(-6deg);transition:opacity .5s,transform .6s var(--e-pop)}
#rvIcon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(43,30,42,.22))}
#rvIcon::before,#rvIcon::after{content:'';position:absolute;background:url(art/kv/sparkle.png) center/contain no-repeat;filter:drop-shadow(0 3px 4px rgba(43,30,42,.2))}
#rvIcon::before{top:24%;right:-7%;width:62px;height:70px}
#rvIcon::after{top:56%;left:-5%;width:40px;height:46px}
#rvType{font-family:var(--sans);font-weight:800;font-size:clamp(34px,10vw,50px);line-height:.96;margin:16px 0 0;letter-spacing:-.01em;color:var(--mag);text-transform:uppercase;opacity:0;transform:translateY(10px);transition:opacity .4s .05s,transform .4s .05s var(--e-out)}
#rvType .l1,#rvType .l2{display:block}
#rvType .l2{font-size:.79em}
#rvEn{font:800 11.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:#000;opacity:0;margin:14px auto 0;max-width:30ch;line-height:1.4;transition:opacity .4s .12s}
#rvLine{font-family:var(--serif);font-variation-settings:'SOFT' 60;font-weight:500;font-size:clamp(17px,4.8vw,20px);line-height:1.45;max-width:24ch;margin:22px auto 0;color:#000;opacity:0;transform:translateY(8px);transition:opacity .4s .18s,transform .4s .18s var(--e-out)}
#rvGo{margin:28px 0 6px;border:none;cursor:pointer;font:800 16px var(--sans);letter-spacing:.03em;text-transform:uppercase;padding:16px 42px;border-radius:999px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 14px 30px rgba(218,24,132,.32);opacity:0;transform:translateY(6px);transition:opacity .5s .24s,transform .5s .24s}
#reveal.go #rvKick,#reveal.go #rvIcon,#reveal.go #rvType,#reveal.go #rvEn,#reveal.go #rvLine,#reveal.go #rvGo{opacity:1;transform:none}
#rvGo:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
/* ---------- result ---------- */
#result{position:absolute;inset:0;z-index:55;display:none;overflow:auto;--mag:#EF0085;background:radial-gradient(58% 40% at 0% 0%,#B9F3FE 0%,rgba(185,243,254,0) 70%),radial-gradient(46% 26% at 100% 52%,#FECDE3 0%,rgba(254,205,227,0) 72%),radial-gradient(60% 30% at 0% 100%,#FDBAD8 0%,rgba(253,186,216,0) 72%),linear-gradient(180deg,#FCFEFF 0%,#FFFBFD 38%,#FFE9F2 74%,#FFDDEC 100%);color:var(--ink);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
#result.on{display:block}
.r-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1.5px solid rgba(43,30,42,.18);padding-bottom:10px;margin-bottom:12px}
.r-emina{height:20px;width:auto}
.r-20u{height:30px;width:auto}
.r-qr{flex:1;text-align:center;font:800 12px var(--sans);letter-spacing:.06em}
.r-qr b{color:var(--mag)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.6);padding:4px;border-radius:999px;margin-bottom:14px}
.tab{flex:1;border:none;background:transparent;border-radius:999px;padding:10px 8px;font:800 12px var(--sans);letter-spacing:.04em;color:var(--mag);cursor:pointer}
.tab.on{background:var(--mag);color:#fff;box-shadow:0 6px 16px rgba(218,24,132,.25)}
.pg{display:none}.pg.on{display:block}
.id-kick{text-align:center;font-family:var(--serif);font-variation-settings:'SOFT' 60;font-size:20px;color:var(--ink2);margin:4px 0 0}
.id-name{text-align:center;font-family:var(--serif);font-variation-settings:'SOFT' 100;font-weight:800;font-size:clamp(23px,7.2vw,33px);line-height:1.04;margin:2px 0 0;padding:0 6px;letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
/* identity page follows the Result-WEB mockup: character beside its cards,
   then passion-universe beside the nutshell. Keeps the character in its own
   grid cell so it can never overlap the card below it. */
.id-grid{display:grid;grid-template-columns:43% 1fr;gap:10px;align-items:center;margin:8px 0 0}
.id-left{display:flex;flex-direction:column;align-items:center;min-width:0}
.id-tag{font-family:var(--serif);font-variation-settings:'SOFT' 60;font-style:italic;font-weight:500;font-size:12.5px;line-height:1.35;text-align:center;color:var(--ink);margin:4px 2px 0}
.id-grid2{display:grid;grid-template-columns:1.72fr 1fr;gap:10px;margin:10px 0 0;align-items:stretch}
.id-grid2 .rc-mag{font-size:12.5px;line-height:1.42}
.id-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.id-grid .rc,.id-grid2 .rc{margin:0}
.id-grid2 .rc{display:flex;flex-direction:column;justify-content:center}
.id-hero{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;min-width:0}
.id-hero img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 20px rgba(43,30,42,.2))}
.rc{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:13px 12px;margin:10px 0 0}
.rc-t{text-align:center;font:800 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 9px}
.rc-nt{text-align:center;font-family:var(--serif);font-variation-settings:'SOFT' 60;font-style:italic;font-weight:600;font-size:14px;color:var(--ink);margin:0 0 5px}
.rc-mag{text-align:center;font-family:var(--serif);font-variation-settings:'SOFT' 60;font-style:italic;font-size:14px;line-height:1.45;color:var(--mag);margin:0}
.sparks{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.sparks span{background:linear-gradient(90deg,#C2C4C5 0%,#F4F5F6 50%,#C2C4C5 100%);border-radius:999px;padding:7px 10px;font:700 11.5px/1.2 var(--sans);color:#000;box-shadow:0 1px 3px rgba(43,30,42,.14);text-align:center;overflow-wrap:anywhere}
.universe{display:flex;justify-content:space-around;gap:4px;text-align:center}
.universe .u{flex:1;min-width:0}
.universe svg{width:34px;height:34px;display:block;margin:0 auto 6px}
.universe .un{font:700 9.5px/1.2 var(--sans);color:var(--ink);overflow-wrap:normal;hyphens:none}
.besties-head{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 0}
.besties-head .sec-h{margin:0}
.sec-h.mag{color:var(--mag);font-size:17px;letter-spacing:.02em}
.bow{width:36px;height:34px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(43,30,42,.2))}
.sec-h{text-align:center;font:800 15px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:22px 0 0}
.sec-sub{text-align:center;font:500 12.5px var(--sans);color:var(--ink2);margin:4px 0 0}
.besties2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 0}
.bestie-card{border-radius:18px;padding:10px 10px 12px;display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;text-align:left;background:linear-gradient(180deg,#F8E9F4 0%,var(--bc2,#F7D9EB) 100%);border:1px solid rgba(255,255,255,.6)}
.bestie-card img{width:56px;height:76px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(43,30,42,.18))}
.bestie-card b{display:block;font:800 13px/1.15 var(--sans);color:var(--ink)}
.bestie-card small{display:block;font:500 10.5px/1.3 var(--sans);color:var(--ink2);margin:4px 0 0}
.g-journey{text-align:center;font:800 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:2px 0 10px}
.g-hi-row{display:flex;align-items:center;gap:10px;margin:2px 0 0}
.g-hi-char{flex:0 0 96px;height:96px;display:grid;place-items:center}
/* The mascot is 122% of its 96px slot, hangs from the slot's top edge and so
   crosses the pill below. It used to get that drop from a percentage height
   resolved against an indefinite basis, which is engine-dependent; top
   alignment plus an aspect-derived height gives the same picture on every
   engine and for every mascot. The share card reads the same two numbers. */
.g-hi-char img{width:122%;height:auto;align-self:start;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(43,30,42,.18))}
.g-hi-hai{font-family:var(--serif);font-variation-settings:'SOFT' 100;font-style:italic;font-weight:700;font-size:20px;color:var(--mag);margin:0}
.g-hi-name{font-family:var(--serif);font-variation-settings:'SOFT' 100;font-weight:800;font-size:clamp(22px,6.4vw,28px);line-height:1.02;margin:2px 0 0;color:var(--ink)}
.g-pill{margin:12px auto 0;text-align:center;background:rgba(255,255,255,.75);border:1.5px solid rgba(218,24,132,.25);border-radius:999px;padding:11px 16px;font:800 13px var(--sans);letter-spacing:.06em;color:var(--mag)}
/* the summit lockup follows Result Page.ai: emina wordmark, then the stylised
   EXPLORER SUMMIT art (its L and U are brand script glyphs, so it is artwork,
   not type), then the date line. Widths are the .ai's own proportions of the
   1080pt artboard: emina 17.8%, lockup 70.2%, date line 87%. */
.g-summit{text-align:center;margin:20px 0 2px}
.g-summit-emina{display:block;width:17.8%;max-width:76px;height:auto;margin:0 auto}
.g-summit-lock{display:block;width:70.2%;max-width:300px;height:auto;margin:8px auto 0}
.g-summit-meta{margin:10px auto 0;font:700 12.5px/1.45 var(--sans);letter-spacing:.01em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.booths3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 0}
.booth{background:rgba(255,255,255,.62);border-radius:16px;padding:10px 8px;text-align:center}
.booth b{display:block;font:800 11.5px/1.2 var(--sans);color:var(--ink);min-height:2.4em}
.booth-b{display:flex;align-items:center;gap:6px;margin:6px 0 0;text-align:left}
.booth-b small{min-width:0;overflow-wrap:anywhere}
.booth-b svg{width:26px;height:26px;flex:0 0 auto}
.booth small{display:block;font:500 10px/1.28 var(--sans);color:var(--ink2)}
/* Stage rows reproduce Emina20-phase2-3-rundown.psd: time + category on one
   underlined line, the title with its highlighted phrases in magenta, and on the
   right a "SPEAKER" tag over the line-up, each face carrying a pink name chip.
   Widths and type are that file's own fractions of its 976pt row, in cqw so they
   track the row; the px line before each clamp is the no-cqw fallback, and the
   floors keep the small chips legible at phone width, where a 1:1 scale of the
   .psd would put the name chips at about 4px. */
.stages3{display:flex;flex-direction:column;margin:10px 0 0}
.stage{container-type:inline-size;display:grid;grid-template-columns:46.6% minmax(0,1fr);column-gap:5.9%;
  align-items:center;padding:3.6% 0;border-bottom:1px dotted rgba(43,30,42,.42)}
.stage:last-child{border-bottom:0}
.st-when{display:flex;flex-wrap:wrap;gap:.2em .84em;margin:0}
.st-when span{font-weight:700;text-transform:uppercase;color:#000;border-bottom:1px solid #000;
  font-size:8.8px;font-size:clamp(8px,2.56cqw,13px)}
.stage .ti{font-weight:800;line-height:1.19;color:#000;margin:.7em 0 0;
  font-size:9.9px;font-size:clamp(9.5px,2.87cqw,14.5px)}
.stage .ti em{font-style:normal;color:var(--mag)}
.st-splabel{display:block;width:fit-content;margin:0 auto;background:#ABE7FF;color:#000;border-radius:4px;
  padding:.3em 1.1em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  font-size:7px;font-size:clamp(7px,1.43cqw,10px)}
/* a slot per speaker, but never wider than a third of the cluster: in the .psd
   a face is 116-155 wide whether the session has two speakers or four, so
   splitting the cluster by head count would blow the small sessions up. */
.st-photos{display:flex;align-items:flex-end;justify-content:center;margin:2% 0 0}
.spk{flex:0 0 calc(100% / var(--n,3));min-width:0;display:flex;flex-direction:column;align-items:center}
.spk img{width:100%;height:48px;height:14cqw;min-height:44px;max-height:70px;object-fit:contain;object-position:bottom;
  filter:drop-shadow(1.5px 0 0 #A9E4FA) drop-shadow(0 1px 2px rgba(43,30,42,.16))}
/* a long name's chip wraps between words and only splits a word that cannot fit
   a line on its own; it stays inside its slot so a chip can never push the row
   wider than the page. */
.spk span{position:relative;z-index:1;width:fit-content;max-width:100%;margin:-.35em 0 0;padding:.18em .5em;
  border-radius:3px;background:#F6C9DD;color:#000;text-align:center;overflow-wrap:break-word;hyphens:none;
  font-weight:700;line-height:1.25;font-size:7px;font-size:clamp(7px,1.6cqw,10.5px)}
/* The .psd pairs the TBA polaroid with the three names set to its RIGHT:
   "TBA :" on a pink chip, then one name per line, the block centred on the
   photo. The unit takes the width its longest name needs and the faces share
   what is left, because at this size the names cannot shrink any further --
   they are already on the 7px floor the chips use. The polaroid is a framed
   print, so it keeps the drop shadow but not the cyan cut-out outline. */
.st-photos.has-tba .spk{flex:1 1 0}
/* beats the rule above on specificity: the unit keeps its content width while
   the faces share what is left. */
.st-photos.has-tba .spk.pola{flex:0 0 auto}
.spk.pola{flex-direction:row;align-items:center;gap:2px}
.spk.pola img{width:auto;filter:drop-shadow(0 1px 2px rgba(43,30,42,.16))}
.tba-side{display:flex;flex-direction:column;align-items:center;white-space:nowrap;
  text-transform:uppercase;font-weight:700;line-height:1.34;color:var(--ink);
  font-size:7px;font-size:clamp(7px,1.6cqw,10.5px)}
/* the name-chip rule above matches every span inside .spk, so the three names
   have to opt out of it; only "TBA :" keeps the pink chip. */
.tba-side span{background:none;padding:0;margin:0;border-radius:0;max-width:none;
  font-size:inherit;line-height:inherit;color:inherit}
.tba-side .tba-tag{padding:.14em .5em;border-radius:3px;background:#F6C9DD;color:#000}
.stage .tba{text-align:center;font-weight:600;line-height:1.3;color:var(--ink2);margin:.4em 0 0;
  font-size:7px;font-size:clamp(7px,1.5cqw,10px)}

.g-free{margin:18px 0 0;text-align:center;font-family:var(--serif);font-variation-settings:'SOFT' 80;font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--mag)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btn{font:800 15px var(--sans);border:none;border-radius:999px;padding:15px 20px;min-height:52px;cursor:pointer;color:#fff;background:var(--mag);box-shadow:0 14px 30px rgba(218,24,132,.22)}
.btn.ghost{background:#fff;color:var(--mag);border:2px solid var(--pink);box-shadow:none}

.fine{text-align:center;font-size:11.5px;color:var(--ink2);margin:12px 0 0}
#modal{position:absolute;inset:0;z-index:60;display:none;background:rgba(27,18,38,.6);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#modal .in{background:#fff;border-radius:24px;padding:16px;max-width:380px;width:100%;max-height:94vh;overflow:auto;position:relative}
#cardImg{width:100%;border-radius:14px;display:block;aspect-ratio:9/16;background:var(--pinkSoft)}
.mx{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:none;background:var(--pinkSoft);cursor:pointer;color:var(--mag);font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<script>
const STORY=/*__STORY__*/;
const EVENT=/*__EVENT__*/;
const FB=/*__FB__*/;
const SPRITES=/*__SPRITES__*/;const SIMPLE=/*__SIMPLE__*/;
const TYPEIMG=/*__TYPEIMG__*/;
const VER='__VER__';
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const SC={};STORY.scenes.forEach(s=>SC[s.id]=s);
const ORDER=STORY.scenes.map(s=>s.id);
const TYPES=STORY.types,BOOTHS=STORY.booths,UI=STORY.ui;
const ICON={
 music:'<path d="M9 17V5l10-2v12" stroke="CUR" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="CUR"/><circle cx="16.5" cy="15.5" r="2.6" fill="CUR"/>',
 palette:'<path d="M12 3a9 9 0 1 0 1 18c1.1 0 1.6-1 1.1-1.9-.5-.9 0-2 1.1-2H16a5 5 0 0 0 5-5c0-5-4-9-9-9Z" stroke="CUR" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="12" r="1.2" fill="CUR"/><circle cx="10" cy="8" r="1.2" fill="CUR"/><circle cx="15" cy="8.5" r="1.2" fill="CUR"/>',
 ball:'<circle cx="12" cy="12" r="9" stroke="CUR" stroke-width="2"/><path d="M4.2 8.5C9 9.5 13 13.5 14 20M19.8 8.5C15 9.5 11 13.5 10 20" stroke="CUR" stroke-width="2" stroke-linecap="round"/>',
 leaf:'<path d="M20 4C9 4 4 9 4 18c0 0 3 2 7.5 2C19 20 20 12 20 4Z" stroke="CUR" stroke-width="2" stroke-linejoin="round"/><path d="M5 19C9 13.5 13 10.5 18 9" stroke="CUR" stroke-width="2" stroke-linecap="round"/>',
 flask:'<path d="M9.5 3h5M10.5 3v5.5L5.6 17.6A2 2 0 0 0 7.4 20.6h9.2a2 2 0 0 0 1.8-3L13.5 8.5V3" stroke="CUR" stroke-width="2" stroke-linejoin="round"/><path d="M8 15h8" stroke="CUR" stroke-width="2"/>',
 film:'<rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="CUR" stroke-width="2"/><path d="M7.5 4.5v15M16.5 4.5v15M3 9.5h4.5M16.5 9.5H21M3 14.5h4.5M16.5 14.5H21" stroke="CUR" stroke-width="2"/>',
 sparkle:'<path d="M12 3l1.9 5.6L19.5 10l-5.6 1.4L12 17l-1.9-5.6L4.5 10l5.6-1.4Z" fill="CUR"/>',
 dress:'<path d="M8.5 3l1 3-2 2.5 2 1.8L7.5 20h9l-2-9.7 2-1.8-2-2.5 1-3" stroke="CUR" stroke-width="2" stroke-linejoin="round"/>',
 mind:'<path d="M12 4.5a5 5 0 0 0-5 5c0 1.4-1 2-1 3.4 0 1 .8 1.6 1.8 1.6V18a2 2 0 0 0 2 2h2.2" stroke="CUR" stroke-width="2" stroke-linecap="round"/><path d="M12 4.5a5 5 0 0 1 5 5c0 1.4 1 2 1 3.4" stroke="CUR" stroke-width="2" stroke-linecap="round"/>'
};
function icon(k,c){c=c||'#EF0085';return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">'+(ICON[k]||ICON.sparkle).replace(/CUR/g,c)+'</svg>';}

let LANG='id';try{LANG=localStorage.getItem('eq_lang')||'id';}catch(e){}
const T=v=>v==null?'':(typeof v==='string'?v:(v[LANG]||v.id||v.en||''));
/* the result pages are English regardless of the quiz language (client brief) */
const TE=v=>v==null?'':(typeof v==='string'?v:(v.en||v.id||''));
function fmt(s,o){return String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]==null?m:o[k]);}

/* ---------------- state ---------------- */
let G;
function fresh(){G={node:ORDER[0],type:{},booth:{},doubt:null,interest:null,trail:[],lock:false,name:''};}
/* ---------------- sound (synth only) ---------------- */
const SFX={ctx:null,ambGain:null,
  unlock(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.ambient();}catch(e){}},
  ambient(){const c=this.ctx;if(!c)return;const g=c.createGain();g.gain.value=0;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
    [110,110.6].forEach(f=>{const o=c.createOscillator();o.frequency.value=f;o.connect(lp);o.start();});
    lp.connect(g);g.connect(c.destination);g.gain.setTargetAtTime(.012,c.currentTime,1.2);this.ambGain=g;},
  noise(dur){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s;},
  tick(){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=1800;g.gain.setValueAtTime(.022,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0005,c.currentTime+.05);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.06);},
  pick(){const c=this.ctx;if(!c)return;[660,880].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;const t=c.currentTime+i*.07;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.32);});},
  swoosh(){const c=this.ctx;if(!c)return;const n=this.noise(.5),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(200,c.currentTime);lp.frequency.exponentialRampToValueAtTime(1600,c.currentTime+.45);
    const g=c.createGain();g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.05,c.currentTime+.25);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.5);n.connect(lp);lp.connect(g);g.connect(c.destination);n.start();},
  chord(){const c=this.ctx;if(!c)return;const dl=c.createDelay();dl.delayTime.value=.12;const fb=c.createGain();fb.gain.value=.35;dl.connect(fb);fb.connect(dl);dl.connect(c.destination);
    [523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;const t=c.currentTime+i*.16;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.1);g.gain.exponentialRampToValueAtTime(.001,t+2.4);o.connect(g);g.connect(c.destination);g.connect(dl);o.start(t);o.stop(t+2.5);});}
};
const haptic=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

/* ---------------- welcome + language ---------------- */
function renderWelcome(){const w=STORY.welcome;
  $('#khBg').src='art/kv/cover.jpg?v='+VER;
  document.querySelectorAll('img.r-emina,img.g-summit-emina').forEach(i=>i.src='art/kv/emina.png?v='+VER);$('.g-summit-lock').src='art/kv/explorer-summit.png?v='+VER;
  document.querySelectorAll('img.r-20u').forEach(i=>i.src='art/kv/logo-20u20.png?v='+VER);
  $('#wGreet').textContent=T(w.greet);$('#wLead').innerHTML=T(w.lead);$('#wNameLbl').textContent=T(w.namePrompt);$('#nameIn').placeholder=T(w.namePh);
  $('#startBtn').textContent=T(w.cta);
  document.querySelectorAll('.lang').forEach(b=>b.textContent=LANG==='id'?'EN':'ID');
  $('#rvGo').textContent=T(UI.seeCard)+' ✨';$('#tab1').textContent=TE(UI.page1);$('#tab2').textContent=TE(UI.page2);
  $('#share').textContent=TE(UI.save)+' 📲';$('#again').textContent=TE(UI.again)+' ↩';$('#saveCard').textContent=TE(UI.save)+' 💾';
  $('#m-fine').textContent=LANG==='id'?'Tekan & tahan gambarnya buat simpan':'Press and hold the image to save';}
function setLang(l){LANG=l;try{localStorage.setItem('eq_lang',l);}catch(e){}renderWelcome();if($('#result').classList.contains('on'))showResult();}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(LANG==='id'?'en':'id')));
renderWelcome();
STORY.scenes.forEach(sc=>{if(sc.plain||!sc.img)return;const im=new Image();im.src=sc.img+'?v='+VER;});
if(TYPEIMG)Object.values(TYPEIMG).forEach(u=>{const im=new Image();im.src=u+'?v='+VER;});
$('#startBtn').addEventListener('click',()=>{SFX.unlock();haptic(10);fresh();G.name=($('#nameIn').value||'').trim().slice(0,24);$('#welcome').classList.remove('on');$('#game').classList.add('on');enter(ORDER[0],true);});

/* ---------------- stage: scene image ---------------- */
const stage=$('#stage'),imgs=[$('#bgA'),$('#bgB')];let cur=0;
function sceneSrc(id){return (SC[id].img||('art/'+id+'.jpg'))+'?v='+VER;}
function setImage(id){
  return new Promise(res=>{
    const nxt=imgs[1-cur],prev=imgs[cur];stage.style.setProperty('--fb',FB[id]||'#F7CFE0');const src=sceneSrc(id);
    const done=()=>{nxt.classList.add('on');prev.classList.remove('on');cur=1-cur;res();};
    if(nxt.getAttribute('src')===src&&nxt.complete&&nxt.naturalWidth>0){done();return;}
    nxt.onload=done;nxt.onerror=()=>{res();};
    nxt.src=src;
  });
}
function applyTheme(s){const g=$('#game'),dark=(s.theme==='dark');
  g.classList.toggle('darktheme',dark);g.classList.toggle('lighttheme',!dark);
  const p=s.panel||{},top=p.top||(dark?'#374079':'#FFF5FA');
  g.style.setProperty('--pbg',top);g.style.setProperty('--pbg2',p.bottom||top);
  g.style.setProperty('--pimg',p.img?'url("'+p.img+'?v='+VER+'")':'none');}

/* ---------------- text box: typewriter + beats ---------------- */
const txt=$('#txt');
let typing=null,choicesOpen=false;
function hiQuote(t){return String(t).replace(/[“"]([^”"]+)[”"]/g,'<span class="q">“$1”</span>');}
function type(text){return new Promise(res=>{
  txt.className='';txt.textContent='';let i=0;
  const step=()=>{if(!typing||typing.text!==text)return;i+=text.charCodeAt(i)===32?2:1;txt.textContent=text.slice(0,i);if(i%6===0)SFX.tick();
    if(i<text.length){typing.t=setTimeout(step,15);}else{typing=null;txt.innerHTML=hiQuote(text);res();}};
  typing={text,t:0,finish(){clearTimeout(this.t);txt.innerHTML=hiQuote(text);typing=null;res();}};step();});}
async function playBeats(beats,done){
  for(const b of (beats||[])){await type(b.text);await wait(Math.min(1400,520+(b.text||'').length*10));}
  done&&done();
}
$('#panel').addEventListener('click',()=>{SFX.unlock();if(typing)typing.finish();});
stage.addEventListener('click',()=>{SFX.unlock();if(typing)typing.finish();});
document.addEventListener('keydown',e=>{if(!$('#game').classList.contains('on'))return;if(choicesOpen&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];b&&b.click();}});

/* ---------------- scenes ---------------- */
async function enter(id,first){
  const s=SC[id];G.node=id;G.lock=true;choicesOpen=false;
  $('#game').classList.remove('choosing');$('#choices').classList.remove('on');$('#optList').innerHTML='';$('#ask').textContent='';txt.textContent='';txt.className='';
  if(!first){SFX.swoosh();await wait(240);}
  applyTheme(s);
  $('#chipT').textContent=s.chapter;$('#chipP').textContent=T(s.place);$('#chip').classList.add('on');
  if(s.plain){stage.classList.add('plain');imgs.forEach(im=>im.classList.remove('on'));}
  else{stage.classList.remove('plain');await setImage(id);}
  if(!first)await wait(260);
  G.lock=false;
  playBeats(s.beats.map(b=>({text:T(b)})),()=>showChoices(s));
}
function showChoices(s){
  $('#ask').textContent=T(s.prompt);
  const L=$('#optList'),single=s.options.length===1;
  L.innerHTML=s.options.map((o,i)=>'<button class="opt'+(single?' single':'')+'" type="button" data-i="'+i+'">'+T(o.label)+'</button>').join('');
  $('#game').classList.add('choosing');$('#choices').classList.add('on');choicesOpen=true;
  [...L.children].forEach((b,i)=>{setTimeout(()=>b.classList.add('in'),60+i*70);b.addEventListener('click',()=>choose(i));});
}
async function choose(i){
  if(!choicesOpen||G.lock)return;choicesOpen=false;G.lock=true;
  const s=SC[G.node],o=s.options[i];haptic(12);SFX.pick();
  [...document.querySelectorAll('.opt')].forEach((b,j)=>b.classList.add(j===i?'pick':'dim'));
  await wait(460);$('#choices').classList.remove('on');$('#game').classList.remove('choosing');$('#ask').textContent='';
  for(const k in (o.type||{}))G.type[k]=(G.type[k]||0)+o.type[k];
  for(const k in (o.booth||{}))G.booth[k]=(G.booth[k]||0)+o.booth[k];
  if(o.doubt)G.doubt=o.doubt;if(o.interest)G.interest=o.interest;
  G.trail.push({node:G.node,i});
  await wait(140);G.lock=false;
  // the deck slides are the whole story: a choice goes straight to the next
  // chapter, with no extra narration in between (option `react` text is unused).
  if(o.leadsTo==='ending')reveal();else enter(o.leadsTo,false);
}

/* ---------------- scoring (deck: sum, rank, recency tie-break, stable code order) ---------------- */
const RECENCY=['c6','c3','c2','c1'];
function contrib(kind,code,node){const t=G.trail.find(x=>x.node===node);if(!t)return 0;const o=SC[node].options[t.i];return (o[kind]||{})[code]||0;}
function rank(kind,order){
  const sc=G[kind];const codes=order.slice();
  codes.sort((a,b)=>{const d=(sc[b]||0)-(sc[a]||0);if(d)return d;
    for(const n of RECENCY){const e=contrib(kind,b,n)-contrib(kind,a,n);if(e)return e;}
    return order.indexOf(a)-order.indexOf(b);});
  return codes;
}
function outcome(){
  const types=rank('type',STORY.typeOrder);const win=types[0];
  let booths=rank('booth',STORY.boothOrder).filter(b=>(G.booth[b]||0)>0);
  TYPES[win].booths.forEach(b=>{if(booths.indexOf(b)<0)booths.push(b);});
  booths=booths.slice(0,3);

      cx.fillStyle=INK;cx.font='800 24px '+SANS;cx.textAlign='center';const ny=wrapY(bc.name,bx+bwid/2,y+44,bwid-20,28);
      const ii=await iconImg(bc.icon,MAG,44);if(ii)cx.drawImage(ii,bx+16,ny+30,44,44);
      cx.fillStyle=INK2;cx.font='500 20px '+SANS;wrapY(TE(bc.desc),bx+76,ny+46,bwid-92,25,'left');}
    y+=bh+22;
    cx.fillStyle=INK;cx.font='800 36px '+SANS;cx.textAlign='center';cx.fillText(String(UI.stages).toUpperCase(),W/2,y);
    cx.fillStyle=INK2;cx.font='500 25px '+SANS;y=wrapY(TE(UI.stagesSub),W/2,y+36,W-180,32)+16;
    /* Stage rows follow Emina20-phase2-3-rundown.psd. The card's row is 980 wide
       and the .psd's is 976, so the sizes below are that file's own numbers:
       time/category 25, title 28/33.3, SPEAKER tag 14 in a 110x30 chip, photos
       137 tall, name chips 11 in a 16-tall pill, 1px 2/2 dotted rule. */
    const CX0=50, CW=W-100, RPAD=CW*0.036, GAP=0;
    const T1W=CW*0.466, CLW=CW*0.475, CLX=CX0+CW-CLW;
    const nlines=(t,mw)=>{const ws=String(t).split(' ');let l='',n=1;
      ws.forEach(w=>{const c=(l+' '+w).trim();if(cx.measureText(c).width>mw&&l){n++;l=w;}else l=c;});return n;};
    const wrapWords=(t,mw)=>{const ws=String(t).split(' ');const ls=[];let cur='';
      ws.forEach(w=>{const c=(cur?cur+' ':'')+w;if(cx.measureText(c).width>mw&&cur){ls.push(cur);cur=w;}else cur=c;});
      if(cur)ls.push(cur);return ls;};
    /* the .psd sets part of each title in magenta, so the title is drawn as
       coloured runs rather than one fillText. */
    const richSegs=(t,hi)=>{let segs=[{t:String(t),hi:false}];
      (hi||[]).forEach(h=>{const out=[];
        segs.forEach(sg=>{if(sg.hi){out.push(sg);return;}
          const parts=sg.t.split(h);
          parts.forEach((pt,i)=>{if(pt)out.push({t:pt,hi:false});if(i<parts.length-1)out.push({t:h,hi:true});});});
        segs=out;});
      const words=[];segs.forEach(sg=>sg.t.split(' ').forEach(w=>{if(w)words.push({w,hi:sg.hi});}));return words;};
    const richWrap=(words,mw)=>{const ls=[];let cur=[];
      words.forEach(it=>{const test=cur.concat([it]).map(o=>o.w).join(' ');
        if(cx.measureText(test).width>mw&&cur.length){ls.push(cur);cur=[it];}else cur.push(it);});
      if(cur.length)ls.push(cur);return ls;};
    const drawRich=(ls,x,y,lh)=>{ls.forEach((ln,i)=>{let xx=x;
      ln.forEach((it,j)=>{cx.fillStyle=it.hi?MAG:'#000';const t=it.w+(j<ln.length-1?' ':'');
        cx.fillText(t,xx,y+i*lh);xx+=cx.measureText(t).width;});});};

    const ROOM=1842-y;
    let fWhen,fTi,liTi,fTag,tagW,tagH,photoH,fChip,chipH,rows,total,K=1;
    for(let pass=0;pass<8;pass++){
      fWhen=25*K;fTi=28*K;liTi=33.3*K;fTag=14*K;tagW=110*K;tagH=30*K;photoH=137*K;fChip=11*K;chipH=16*K;
      rows=R.picks.slice(0,3).map(pk=>{const st=STG[pk]||{};
        cx.font='800 '+fTi+'px '+SANS;
        const words=richSegs(st.title||'',st.hi), tl=richWrap(words,T1W).length;
        const names=st.speakers||[];
        cx.font='700 '+fChip+'px '+SANS;
        /* the TBA unit is the polaroid plus the name column beside it; it takes
           the width it needs and the faces share the rest -- see .spk.pola */
        const tbaNames=(st.tbaPhoto&&(st.tba||[]).length)?st.tba.map(n=>n.toUpperCase()):null;
        const polaW=st.tbaPhoto?photoH*POLA_AR:0;
        const colW=tbaNames?Math.max(...[TBA_TAG,...tbaNames].map(t=>cx.measureText(t).width))+fChip:0;
        const unitW=st.tbaPhoto?polaW+fChip*0.2+colW:0;
        const slot=unitW?(CLW-unitW)/Math.max(1,names.length)
                        :CLW/Math.max(3,names.length);   // see .spk in the stylesheet
        const chips=names.map(nm=>wrapWords(nm,slot-fChip));
        const chipRows=Math.max(1,...chips.map(c=>c.length));
        const tbaTxt=((st.tba||[]).length&&!st.tbaPhoto)?'TBA: '+st.tba.join(' / '):'';
        cx.font='600 '+fChip+'px '+SANS;
        const bl=tbaTxt?nlines(tbaTxt,CLW):0;
        const textH=fWhen*1.2+fTi*0.7+tl*liTi;
        const clusterH=tagH+CW*0.02+photoH-fChip*0.35+chipRows*chipH*1.25+(bl?fChip*0.5+bl*fChip*1.3:0);
        return {st,words,tl,names,tbaNames,polaW,colW,unitW,slot,chips,chipRows,tbaTxt,bl,h:Math.max(textH,clusterH)+RPAD*2};});
      total=rows.reduce((t,r)=>t+r.h,0);
      if(total<=ROOM||K<=0.6)break;
      K=Math.max(0.6,K*Math.max(0.85,ROOM/total));
    }
    for(let ri=0;ri<rows.length;ri++){
      const r=rows[ri], st=r.st, CH=r.h;
      // ---- left: time + category on one underlined line, then the title
      const textH=fWhen*1.2+fTi*0.7+r.tl*liTi;
      let ty=y+(CH-textH)/2;
      cx.textAlign='left';cx.fillStyle='#000';cx.font='700 '+fWhen+'px '+SANS;
      const base=ty+fWhen*0.82;
      const t1=String(st.time||''), t2=String(st.cat||'').toUpperCase();
      cx.fillText(t1,CX0,base);
      const w1=cx.measureText(t1).width, x2=CX0+w1+fWhen*0.84;
      cx.fillText(t2,x2,base);
      const w2=cx.measureText(t2).width, ul=Math.max(1,K*1.5);
      cx.fillRect(CX0,base+fWhen*0.22,w1,ul);cx.fillRect(x2,base+fWhen*0.22,w2,ul);
      ty+=fWhen*1.2+fTi*0.7;
      cx.font='800 '+fTi+'px '+SANS;
      drawRich(richWrap(r.words,T1W),CX0,ty+fTi*0.78,liTi);
      // ---- right: SPEAKER tag over the line-up, a pink name chip on each face
      const clusterH=tagH+CW*0.02+photoH-fChip*0.35+r.chipRows*chipH*1.25+(r.bl?fChip*0.5+r.bl*fChip*1.3:0);
      let cy2=y+(CH-clusterH)/2;
      cx.fillStyle='#ABE7FF';rr(cx,CLX+(CLW-tagW)/2,cy2,tagW,tagH,Math.max(2,4*K));cx.fill();
      cx.fillStyle='#000';cx.font='800 '+fTag+'px '+SANS;cx.textAlign='center';
      cx.fillText(TE(UI.speakerTag).toUpperCase(),CLX+CLW/2,cy2+tagH/2+fTag*0.36);
      cy2+=tagH+CW*0.02;
      const ph=st.photos||[], n=r.names.length, slot=r.slot, pbase=cy2+photoH;
      const gx=CLX+(CLW-(slot*n+r.unitW))/2;   // the group stays centred in the cluster
      if(r.unitW){const im=await loadImg(st.tbaPhoto+'?v='+VER);
        const ux=gx+slot*n;
        if(im)cx.drawImage(im,ux,pbase-photoH,r.polaW,photoH);
        if(r.tbaNames){
          // the .psd centres the four lines on the photo, "TBA :" on a pink chip
          const lh=fChip*1.45, cxm=ux+r.polaW+fChip*0.2+r.colW/2;
          let ly=pbase-photoH/2-lh*2;
          cx.font='700 '+fChip+'px '+SANS;cx.textAlign='center';
          const tw=cx.measureText(TBA_TAG).width+fChip*0.9;
          cx.fillStyle='#F6C9DD';rr(cx,cxm-tw/2,ly+lh*0.1,tw,lh*0.9,Math.max(2,3*K));cx.fill();
          cx.fillStyle='#000';cx.fillText(TBA_TAG,cxm,ly+lh*0.74);
          cx.fillStyle=INK;
          r.tbaNames.forEach((nm,i)=>cx.fillText(nm,cxm,ly+lh*(i+1)+lh*0.74));}}
      for(let j=0;j<n;j++){
        const sx=gx+j*slot;
        const im=ph[j]?await loadImg(ph[j]+'?v='+VER):null;
        if(im){const sc=Math.min(slot/im.width,photoH/im.height),dw=im.width*sc,dh=im.height*sc;
          const dx=sx+(slot-dw)/2;
          // the page's 1.5px cyan offset at its 343px row, scaled to this row
          cx.save();cx.shadowColor='#A9E4FA';cx.shadowBlur=0;cx.shadowOffsetX=4.3*K;
          cx.drawImage(im,dx,pbase-dh,dw,dh);cx.restore();
          cx.drawImage(im,dx,pbase-dh,dw,dh);}
        const ls=r.chips[j]||[];
        cx.font='700 '+fChip+'px '+SANS;
        const cw=Math.max(...ls.map(l=>cx.measureText(l).width))+fChip;
        const chTop=pbase-fChip*0.35, chH=ls.length*chipH*1.25;
        cx.fillStyle='#F6C9DD';rr(cx,sx+slot/2-cw/2,chTop,cw,chH,Math.max(2,3*K));cx.fill();
        cx.fillStyle='#000';cx.textAlign='center';
        ls.forEach((l,li)=>cx.fillText(l,sx+slot/2,chTop+chipH*1.25*(li+0.5)+fChip*0.34));
      }
      if(r.bl){cy2=pbase-fChip*0.35+r.chipRows*chipH*1.25+fChip*0.5;
        cx.fillStyle=INK2;cx.font='600 '+fChip+'px '+SANS;cx.textAlign='center';
        wrapY(r.tbaTxt,CLX+CLW/2,cy2+fChip*0.78,CLW,fChip*1.3);}
      // ---- the .psd's dotted rule between rows
      if(ri<rows.length-1){cx.save();cx.strokeStyle='rgba(43,30,42,.55)';cx.lineWidth=Math.max(1,K);
        cx.setLineDash([2*K,2*K]);cx.beginPath();cx.moveTo(CX0,y+CH);cx.lineTo(CX0+CW,y+CH);cx.stroke();cx.restore();}
      y+=CH+GAP;
    }
    cx.textAlign='center';cx.fillStyle=MAG;cx.font='italic 700 34px Fraunces,serif';
    cx.fillText('✦ '+TE(UI.seeYou)+' ✦',W/2,Math.min(y+48,1878));
  }
  try{$('#cardImg').src=canvas.toDataURL('image/png');}catch(err){}
}
let _dl;async function getDL(){if(_dl!==undefined)return _dl;try{_dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;}catch(e){_dl=null;}return _dl;}
$('#share').addEventListener('click',()=>{$('#cardImg').removeAttribute('src');$('#modal').classList.add('on');buildCard(PAGE);});
$('#mx').addEventListener('click',()=>$('#modal').classList.remove('on'));
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.remove('on');});
$('#saveCard').addEventListener('click',()=>{const a=TYPES[R.win],name='emina-explorer-'+R.win.toLowerCase()+'-p'+PAGE+'.png';const text=fmt(TE(UI.shareText),{type:a.name})+' #Emina20Under20';
  canvas.toBlob(async b=>{if(!b)return;try{const f=new File([b],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Emina 20 Under 20',text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    const dl=await getDL();if(dl){try{await dl.save({filename:name,data:b});return;}catch(e){if(e&&e.code==='declined')return;}}
    try{const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}catch(e){}},'image/png');});

fresh();
</script>
